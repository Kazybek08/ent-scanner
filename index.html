<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ҰБТ-сканер">
<title>ҰБТ-сканер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="backBtn" hidden data-i18n-aria="nav.back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="brand">
    <h1 id="screenTitle" data-i18n="app.title">ҰБТ-сканер</h1>
  </div>
  <div class="lang" role="group" data-i18n-aria="lang.switch">
    <button type="button" data-lang="kk">ҚАЗ</button>
    <button type="button" data-lang="ru">РУС</button>
  </div>
</header>

<main id="app">
  <!-- Главный экран: шесть разделов -->
  <section class="screen" data-screen="home">
    <p class="lead" data-i18n="app.subtitle"></p>
    <nav class="tiles" aria-label="Menu">
      <a class="tile tile-active" href="#students">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="tile-title" data-i18n="nav.students"></span>
        <span class="tile-hint" data-i18n="nav.students.hint"></span>
      </a>
      <a class="tile tile-active" href="#tests">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>
        <span class="tile-title" data-i18n="nav.tests"></span>
        <span class="tile-hint" data-i18n="nav.tests.hint"></span>
      </a>
      <a class="tile tile-active" href="#print">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span class="tile-title" data-i18n="nav.print"></span>
        <span class="tile-hint" data-i18n="nav.print.hint"></span>
      </a>
      <a class="tile tile-active" href="#scan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        <span class="tile-title" data-i18n="nav.scan"></span>
        <span class="tile-hint" data-i18n="nav.scan.hint"></span>
      </a>
      <a class="tile tile-active" href="#review">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="tile-title" data-i18n="nav.review"></span>
        <span class="tile-hint" data-i18n="nav.review.hint"></span>
      </a>
      <a class="tile tile-active" href="#settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="tile-title" data-i18n="nav.settings"></span>
        <span class="tile-hint" data-i18n="nav.settings.hint"></span>
      </a>
    </nav>
    <div class="card backup-banner" id="homeBackup" hidden>
      <p id="homeBackupText"></p>
      <button class="btn-primary btn-small" id="homeBackupBtn" type="button" data-i18n="backup.save"></button>
    </div>
    <p class="note" id="offlineNote" hidden data-i18n="offline.ready"></p>
    <p class="note" id="installNote" hidden data-i18n="install.hint"></p>
  </section>

  <!-- Печать бланков -->
  <section class="screen" data-screen="print" hidden>
    <div class="card">
      <img class="sheet-thumb" src="icons/sheet-preview.svg" alt="" width="120" height="170">
      <p data-i18n="print.lead"></p>
      <button class="btn-primary" id="downloadPdf" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span data-i18n="print.download"></span>
      </button>
      <p class="status" id="printStatus" role="status" aria-live="polite"></p>
      <p class="note" id="logoNote"></p>
    </div>
    <div class="card">
      <h2 data-i18n="print.tips.title"></h2>
      <ul class="tips">
        <li data-i18n="print.tip1"></li>
        <li data-i18n="print.tip2"></li>
        <li data-i18n="print.tip3"></li>
      </ul>
    </div>
  </section>

  <!-- Ученики -->
  <section class="screen" data-screen="students" hidden>
    <div class="toolbar">
      <button class="btn-primary btn-small" id="studentAdd" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="students.add"></span>
      </button>
      <label class="btn-secondary btn-small" for="studentImport">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
        <span data-i18n="students.import"></span>
      </label>
      <input class="visually-hidden" id="studentImport" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
    </div>
    <div class="toolbar-links">
      <button class="btn-link" id="studentTemplate" type="button" data-i18n="students.template"></button>
      <button class="btn-link" id="studentPrint" type="button" data-i18n="students.print"></button>
    </div>
    <input class="search" id="studentSearch" type="search" data-i18n-placeholder="students.search" autocomplete="off">
    <p class="summary" id="studentCount"></p>
    <p class="card note" id="studentEmpty" hidden data-i18n="students.empty"></p>
    <ul class="plain-list" id="studentList"></ul>
  </section>

  <!-- Пробники и ключи -->
  <section class="screen" data-screen="tests" hidden>
    <div class="toolbar">
      <button class="btn-primary btn-small" id="testAdd" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="tests.add"></span>
      </button>
      <button class="btn-secondary btn-small" id="keysTemplate" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span data-i18n="tests.template"></span>
      </button>
    </div>
    <p class="note" data-i18n="tests.lead"></p>
    <input class="visually-hidden" id="keysFile" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
    <p class="card note" id="testEmpty" hidden data-i18n="tests.empty"></p>
    <ul class="plain-list" id="testList"></ul>
  </section>

  <!-- Сканирование -->
  <section class="screen" data-screen="scan" hidden>
    <div class="card" id="scanNoTest" hidden>
      <p data-i18n="scan.noTest"></p>
      <a class="btn-primary" href="#tests" data-i18n="tests.add"></a>
    </div>
    <div class="card" id="scanControls">
      <label class="field-label" for="scanTest" data-i18n="scan.test"></label>
      <select class="select" id="scanTest"></select>
      <p class="warn-text" id="scanKeysWarn" hidden data-i18n="scan.noKeys"></p>
      <p data-i18n="scan.lead"></p>
      <label class="btn-primary" for="scanCamera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span data-i18n="scan.camera"></span>
      </label>
      <input class="visually-hidden" id="scanCamera" type="file" accept="image/*" capture="environment">
      <label class="btn-secondary" for="scanFiles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
        <span data-i18n="scan.files"></span>
      </label>
      <input class="visually-hidden" id="scanFiles" type="file" accept="image/*,application/pdf" multiple>
      <p class="status" id="scanStatus" role="status" aria-live="polite"></p>
    </div>
    <div class="row-between">
      <p class="summary" id="scanSummary" hidden></p>
      <a class="btn-link" id="scanReviewLink" href="#review" hidden data-i18n="review.go"></a>
    </div>
    <ul class="results" id="scanResults"></ul>
  </section>

  <!-- Проверка и результаты -->
  <section class="screen" data-screen="review" hidden>
    <div class="card" id="reviewNoTest" hidden>
      <p data-i18n="scan.noTest"></p>
      <a class="btn-primary" href="#tests" data-i18n="tests.add"></a>
    </div>
    <div id="reviewBody">
      <label class="field-label" for="reviewTest" data-i18n="scan.test"></label>
      <select class="select" id="reviewTest"></select>
      <div class="segmented tabs" id="reviewTabs" role="radiogroup">
        <button type="button" role="radio" data-value="check"><span data-i18n="review.tabCheck"></span> <b class="tab-count" id="reviewTabCount"></b></button>
        <button type="button" role="radio" data-value="results"><span data-i18n="review.tabResults"></span></button>
      </div>

      <!-- Результаты -->
      <div id="resPanel" hidden>
        <p class="card note" id="resEmpty" hidden data-i18n="res.empty"></p>
        <div id="resContent">
          <div class="stats" id="resSummary"></div>
          <p class="row-sub" id="resAvgLine" style="white-space: pre-line"></p>
          <div class="toolbar">
            <button class="btn-primary btn-small" id="resExcel" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13l4 5M12 13l-4 5"/></svg>
              <span data-i18n="res.excel"></span>
            </button>
            <button class="btn-secondary btn-small" id="resBackup" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><path d="M8 16l4-4 4 4M12 12v9"/></svg>
              <span data-i18n="backup.save"></span>
            </button>
          </div>
          <p class="note" id="resBackupNote"></p>
          <label class="field-label" for="resGroup" data-i18n="res.group"></label>
          <select class="select" id="resGroup"></select>
          <ul class="plain-list" id="resList"></ul>
          <h3 class="edit-h" data-i18n="res.groupsTitle"></h3>
          <div class="table-wrap"><table class="mini-table" id="resGroups"></table></div>
        </div>
      </div>

      <div id="reviewCheckPanel">
      <button class="btn-primary" id="reviewStart" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span data-i18n="review.start"></span>
      </button>
      <p class="card note ok-note" id="reviewDone" hidden data-i18n="review.allDone"></p>
      <p class="card note" id="reviewEmpty" hidden data-i18n="review.empty"></p>
      <div class="segmented filter" id="reviewFilter" role="radiogroup">
        <button type="button" role="radio" data-value="check"><span data-i18n="review.needCheck"></span> <b id="reviewCountCheck"></b></button>
        <button type="button" role="radio" data-value="all"><span data-i18n="review.all"></span> <b id="reviewCountAll"></b></button>
      </div>
      <ul class="results" id="reviewList"></ul>
      </div>
    </div>
  </section>

  <!-- Настройки -->
  <section class="screen" data-screen="settings" hidden>
    <div class="card">
      <h2 data-i18n="set.backupTitle"></h2>
      <p class="note" data-i18n="set.backupLead"></p>
      <p class="note" id="setBackupNote"></p>
      <div class="toolbar">
        <button class="btn-primary btn-small" id="setBackup" type="button"><span data-i18n="backup.save"></span></button>
        <label class="btn-secondary btn-small" for="setRestoreFile"><span data-i18n="backup.restore"></span></label>
      </div>
      <input class="visually-hidden" id="setRestoreFile" type="file" accept=".json,application/json">
    </div>

    <div class="card">
      <h2 data-i18n="set.thrTitle"></h2>
      <p class="note" data-i18n="set.thrLead"></p>
      <div class="thr-grid" id="setThr"></div>
      <div class="toolbar">
        <button class="btn-primary btn-small" id="setThrSave" type="button" data-i18n="form.save"></button>
        <button class="btn-secondary btn-small" id="setThrReset" type="button" data-i18n="set.thrReset"></button>
      </div>
      <p class="status" id="setThrMsg" role="status" aria-live="polite"></p>
    </div>

    <div class="card">
      <h2 data-i18n="set.combosTitle"></h2>
      <p class="note" data-i18n="set.combosLead"></p>
      <ul class="plain-list" id="setCombos"></ul>
      <p class="note" id="setCombosEmpty" data-i18n="set.combosEmpty"></p>
      <div class="combo-add">
        <label><span class="field-label" data-i18n="set.p1"></span><select class="select" id="setComboP1"></select></label>
        <label><span class="field-label" data-i18n="set.p2"></span><select class="select" id="setComboP2"></select></label>
      </div>
      <button class="btn-secondary btn-small" id="setComboAdd" type="button" data-i18n="set.comboAdd"></button>
    </div>

    <div class="card">
      <h2 data-i18n="set.logoTitle"></h2>
      <img class="logo-preview" id="setLogoImg" alt="" hidden>
      <p class="note" id="setLogoNote"></p>
      <div class="toolbar">
        <label class="btn-secondary btn-small" for="setLogoFile"><span data-i18n="set.logoPick"></span></label>
        <button class="btn-link" id="setLogoRemove" type="button" hidden data-i18n="set.remove"></button>
      </div>
      <input class="visually-hidden" id="setLogoFile" type="file" accept="image/png,image/jpeg,image/*">
    </div>

    <div class="card">
      <h2 data-i18n="set.storageTitle"></h2>
      <p class="note" id="setStorage"></p>
      <p class="note" id="setPersistNote"></p>
      <button class="btn-link" id="setPersist" type="button" hidden data-i18n="set.persistAsk"></button>
    </div>
  </section>

  <!-- Заглушка для разделов, которые ещё не готовы -->
  <section class="screen" data-screen="soon" hidden>
    <div class="card">
      <span class="badge" data-i18n="soon.badge"></span>
      <p id="soonText"></p>
    </div>
  </section>
</main>

<dialog id="studentResDialog" class="edit-dialog" aria-labelledby="studentResTitle">
  <div class="dialog-head">
    <h2 id="studentResTitle"></h2>
    <button class="icon-btn" id="studentResClose" type="button" data-i18n-aria="scan.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="edit-body" id="studentResBody"></div>
  <div class="edit-foot one"><button class="btn-secondary" id="studentResOpen" type="button" data-i18n="res.openSheet"></button></div>
</dialog>

<dialog id="editDialog" class="edit-dialog" aria-labelledby="editTitle">
  <div class="dialog-head">
    <h2 id="editTitle"></h2>
    <span class="edit-pos" id="editPos"></span>
    <button class="icon-btn" id="editClose" type="button" data-i18n-aria="scan.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="edit-body" id="editBody"></div>
  <div class="edit-foot">
    <button class="btn-secondary" id="editSave" type="button"></button>
    <button class="btn-primary" id="editNext" type="button" data-i18n="edit.saveNext"></button>
  </div>
</dialog>

<dialog id="formDialog" class="form-dialog" aria-labelledby="formTitle">
  <form id="formEl" method="dialog" novalidate>
    <h2 id="formTitle"></h2>
    <div id="formBody"></div>
    <div class="form-buttons">
      <button class="btn-primary" id="formSubmit" type="submit"></button>
      <button class="btn-secondary" id="formCancel" type="button"></button>
      <button class="btn-danger" id="formDanger" type="button" hidden></button>
    </div>
  </form>
</dialog>

<script src="vendor/jspdf.umd.min.js" defer></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
